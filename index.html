<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرم ثبت‌نام</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>فرم ثبت‌نام</h1>

  <form id="registerForm" novalidate>

    <div class="form-group">
      <label for="firstName">نام</label>
      <input type="text" id="firstName" name="firstName" required>
      <span class="error" id="err-firstName"></span>
    </div>

    <div class="form-group">
      <label for="lastName">نام خانوادگی</label>
      <input type="text" id="lastName" name="lastName" required>
      <span class="error" id="err-lastName"></span>
    </div>

    <div class="form-group">
      <label for="fatherName">نام پدر</label>
      <input type="text" id="fatherName" name="fatherName" required>
      <span class="error" id="err-fatherName"></span>
    </div>

    <div class="form-group">
      <label for="nationalCode">کد ملی</label>
      <input type="text" id="nationalCode" name="nationalCode" maxlength="10" inputmode="numeric" required>
      <span class="error" id="err-nationalCode"></span>
    </div>

    <div class="form-group">
      <label for="phone">تلفن همراه</label>
      <input type="text" id="phone" name="phone" maxlength="11" inputmode="numeric" required>
      <span class="error" id="err-phone"></span>
    </div>

    <div class="form-group">
      <label for="province">استان</label>
      <input type="text" id="province" name="province" required>
      <span class="error" id="err-province"></span>
    </div>

    <div class="form-group">
      <label for="city">شهر</label>
      <input type="text" id="city" name="city" required>
      <span class="error" id="err-city"></span>
    </div>

    <div class="form-group">
      <label for="address">آدرس</label>
      <textarea id="address" name="address" rows="3" required></textarea>
      <span class="error" id="err-address"></span>
    </div>

    <div class="form-group">
      <label for="email">ایمیل</label>
      <input type="email" id="email" name="email" required>
      <span class="error" id="err-email"></span>
    </div>

    <div class="form-group captcha-group">
      <label for="captchaInput">کد امنیتی</label>
      <div class="captcha-row">
        <canvas id="captchaCanvas" width="150" height="50"></canvas>
        <button type="button" id="refreshCaptchaBtn" title="تازه‌سازی کد امنیتی">
          <span id="refreshIcon">↻</span>
        </button>
      </div>
      <div id="refreshTimer" class="refresh-timer"></div>
      <input type="text" id="captchaInput" name="captchaInput" maxlength="6" required>
      <span class="error" id="err-captcha"></span>
    </div>

    <button type="submit" class="submit-btn">ثبت‌نام</button>

    <div id="successMsg" class="success-msg"></div>

  </form>
</div>

<script src="script.js"></script>
</body>
</html>
